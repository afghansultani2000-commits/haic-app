const oldUnit=S.unit||'تومان';
S.tx.forEach(t=>{if(!t.cur)t.cur=oldUnit;if(!t.iso)t.iso=new Date(t.id).toISOString().slice(0,10)});
S.tx.forEach(t=>{if(!S.cur.includes(t.cur))S.cur.push(t.cur)});
function save(){try{localStorage.setItem('poolman',JSON.stringify(S))}catch(e){}}
const fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2});
const D='۰۱۲۳۴۵۶۷۸۹',A='٠١٢٣٤٥٦٧٨٩';
function norm(s){return s.replace(/[۰-۹]/g,d=>D.indexOf(d)).replace(/[٠-٩]/g,d=>A.indexOf(d)).replace(/[,٬،\s]/g,'').replace('٫','.')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function today(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function fd(iso){try{return new Date(iso+'T12:00:00').toLocaleDateString('fa-AF-u-ca-persian',{year:'numeric',month:'long',day:'numeric'})}catch(e){return iso}}

function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;const gy2=gm>2?gy+1:gy;let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){let gy=jy<=979?1600:621;jy-=jy<=979?0:979;let days=365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);gy+=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sa=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sa[gm];gm++)gd-=sa[gm];return[gy,gm,gd]}
const JM=['حمل','ثور','جوزا','سرطان','اسد','سنبله','میزان','عقرب','قوس','جدی','دلو','حوت'];
const fy=n=>Number(n).toLocaleString('fa-IR',{useGrouping:false});
function dim(y,m){if(m<=6)return 31;if(m<=11)return 30;const g=j2g(y,12,30),j=g2j(g[0],g[1],g[2]);return j[0]===y&&j[1]===12&&j[2]===30?30:29}
function fillDays(sel){const n=dim(+$('#jy').value,+$('#jm').value),cur=Math.min(sel||+$('#jd').value||1,n);$('#jd').innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}" ${i+1===cur?'selected':''}>${fy(i+1)}</option>`).join('')}
function setJ(iso){const p=iso.split('-').map(Number),j=g2j(p[0],p[1],p[2]);$('#jy').innerHTML=Array.from({length:7},(_,i)=>j[0]-5+i).map(y=>`<option value="${y}">${fy(y)}</option>`).join('');$('#jy').value=j[0];$('#jm').innerHTML=JM.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');$('#jm').value=j[1];fillDays(j[2])}
function getIso(){const g=j2g(+$('#jy').value,+$('#jm').value,+$('#jd').value);return g[0]+'-'+String(g[1]).padStart(2,'0')+'-'+String(g[2]).padStart(2,'0')}
function initDate(){setJ(today());$('#jy').onchange=$('#jm').onchange=()=>fillDays()}
function resetForm(){$('#amt').value='';$('#note').value='';$('#det').value='';$('#srcIn').value='';$('#rate').value='';cat=CATS[0];setJ(today())}
function updRate(){
  const c=$('#curSel').value,show=mode==='in'&&c&&c!=='__new__'&&c!==S.base;
  $('#rateBox').hidden=!show;
  if(show){$('#rateLb').textContent='نرخ روز: ۱ '+c+' = چند '+S.base+'؟ (اختیاری)';if(!$('#rate').value&&S.rates[c])$('#rate').value=S.rates[c]}
  else $('#rate').value='';
}
function setMode(m){mode=m;$('#tIn').classList.toggle('on',m==='in');$('#tOut').classList.toggle('on',m==='out');
$('#inBox').hidden=m!=='in';$('#outBox').hidden=m!=='out';$('#noteBox').hidden=m!=='in';$('#detBox').hidden=m!=='out';updRate()}
$('#tIn').onclick=()=>setMode('in');$('#tOut').onclick=()=>setMode('out');
$('#curSel').onchange=e=>{
  if(e.target.value==='__new__'){
    const n=(prompt('نام نوعیت پول جدید (مثلاً پوند)')||'').trim();
    if(n&&!S.cur.includes(n))S.cur.push(n);
    if(n)S.last=n;
  }else S.last=e.target.value;
  $('#rate').value='';save();render();
};

function render(){
  const T={},B={};
  S.tx.forEach(t=>{
    T[t.cur]=T[t.cur]||{i:0,o:0};T[t.cur][t.type==='in'?'i':'o']+=t.amount;
    const k=t.source+'|||'+t.cur;B[k]=B[k]||{s:t.source,c:t.cur,v:0};B[k].v+=t.type==='in'?t.amount:-t.amount;
  });
  const cs=Object.keys(T);
  $('#tot').innerHTML=cs.length?cs.map(c=>`<div class="bl"><span class="total">${fa(T[c].i-T[c].o)}</span><span class="unit">${esc(c)}</span><div class="sum"><span class="in">دریافتی: <b>${fa(T[c].i)}</b></span><span class="out">مصرف: <b>${fa(T[c].o)}</b></span></div></div>`).join(''):'<div class="empty">هنوز چیزی ثبت نشده</div>';
  const ks=Object.keys(B);
  $('#srcCard').hidden=!ks.length;
  $('#srcs').innerHTML=ks.map(k=>`<div class="src"><span>${esc(B[k].s)}</span><b class="${B[k].v<0?'out':''}">${fa(B[k].v)} ${esc(B[k].c)}</b></div>`).join('');
  $('#srcList').innerHTML=[...new Set(ks.map(k=>B[k].s))].map(n=>`<option value="${esc(n)}">`).join('');
  $('#curSel').innerHTML=S.cur.map(c=>`<option ${c===S.last?'selected':''}>${esc(c)}</option>`).join('')+'<option value="__new__">+ نوعیت دیگر…</option>';updRate();
  const cur=$('#srcOut').value;
  $('#srcOut').innerHTML=ks.length?ks.map(k=>`<option value="${esc(k)}" ${k===cur?'selected':''}>${esc(B[k].s)} (${esc(B[k].c)})</option>`).join(''):'<option value="">اول یک دریافتی ثبت کن</option>';
  $('#cats').innerHTML=CATS.map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
  $('#cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});
  const L=S.tx.slice().sort((a,b)=>b.iso.localeCompare(a.iso)||b.id-a.id);
  $('#list').innerHTML=L.length?L.map(t=>`<div class="tx"><div>${esc(t.type==='in'?t.source:(t.note||t.cat))}<small>${esc(t.type==='in'?(t.note||''):(t.cat+' ← '+t.source))} ${fd(t.iso)}</small>${t.rate?`<small>نرخ روز: ${fa(t.rate)} ${esc(S.base)} ← معادل ${fa(t.amount*t.rate)} ${esc(S.base)}</small>`:''}</div><div><b class="${t.type}">${t.type==='in'?'+':'−'}${fa(t.amount)} ${esc(t.cur)}</b>${t.type==='in'?`<button class="d" data-lk="${t.id}" aria-label="لینک">🔗</button>`:''}<button class="d" data-id="${t.id}" aria-label="حذف">×</button></div></div>`).join(''):'<div class="empty">هنوز چیزی ثبت نشده</div>';
  $('#list').querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>shareLink(b.dataset.lk));
  $('#list').querySelectorAll('.d[data-id]').forEach(b=>b.onclick=()=>{if(confirm('این مورد حذف شود؟')){S.tx=S.tx.filter(t=>t.id!=b.dataset.id);save();render()}});
}

$('#go').onclick=()=>{
  const amount=parseFloat(norm($('#amt').value));
  if(!(amount>0)){alert('مبلغ را درست وارد کن');return}
  let source,cur;
  if(mode==='in'){source=$('#srcIn').value.trim();cur=$('#curSel').value;if(cur==='__new__')cur=S.last}
  else{const v=$('#srcOut').value;if(v){[source,cur]=v.split('|||')}}
  if(!source){alert(mode==='in'?'منبع را بنویس':'اول یک دریافتی ثبت کن');return}
  if(mode==='out'){const bal=S.tx.filter(t=>t.source===source&&t.cur===cur).reduce((a,t)=>a+(t.type==='in'?t.amount:-t.amount),0);
    if(amount>bal&&!confirm('موجودی این منبع ('+fa(bal)+' '+cur+') کمتر از مبلغ مصرف است. باز هم ثبت شود؟'))return}
  const rate=mode==='in'&&cur!==S.base?parseFloat(norm($('#rate').value)):0;
  if(rate>0)S.rates[cur]=rate;
  S.tx.push({id:Date.now(),type:mode,amount,source,cur,cat:mode==='out'?cat:'',note:(mode==='in'?$('#note'):$('#det')).value.trim(),iso:getIso(),...(rate>0?{rate}:{})});
  save();const wasIn=mode==='in';resetForm();render();toast(wasIn?'دریافتی ثبت شد ✓':'مصرف ثبت شد ✓');
};

async function saveFile(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.x);toast.x=setTimeout(()=>t.classList.remove('show'),1800)}
const VIEW=(()=>{try{
  if(location.hash.indexOf('#v=')!==0)return null;
  let b=location.hash.slice(3).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const p=JSON.parse(new TextDecoder().decode(u));
  return p&&typeof p.a==='number'&&Array.isArray(p.o)?p:null
}catch(e){return null}})();
function refOf(e){
  const ins=S.tx.filter(t=>t.type==='in'&&t.source===e.source&&t.cur===e.cur).sort((a,b)=>a.iso.localeCompare(b.iso)||a.id-b.id);
  let r=ins[0];ins.forEach(i=>{if(i.iso<=e.iso)r=i});return r&&r.id
}
function linkFor(id){
  const inc=S.tx.find(t=>String(t.id)===String(id));if(!inc)return null;
  const o=S.tx.filter(t=>t.type==='out'&&refOf(t)===inc.id).sort((a,b)=>a.iso.localeCompare(b.iso)||a.id-b.id)
    .map(t=>({d:t.iso,t:t.note||t.cat,k:t.cat,a:t.amount}));
  const p={s:inc.source,a:inc.amount,c:inc.cur,d:inc.iso,n:inc.note||'',r:inc.rate||0,b:S.base,o,g:today()};
  const u=new TextEncoder().encode(JSON.stringify(p));let bin='';for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);
  return location.href.split('#')[0]+'#v='+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')
}
async function shareLink(id){
  const url=linkFor(id);if(!url)return;
  try{if(navigator.share){await navigator.share({title:'گزارش مصرف از دریافتی',url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('لینک کپی شد ✓')}
  catch(e){prompt('این لینک را کپی کن:',url)}
}
function showView(){
  const p=VIEW,o=p.o.map(t=>({d:String(t.d),t:String(t.t||''),k:String(t.k||''),a:Number(t.a)||0}));
  const sum=o.reduce((a,t)=>a+t.a,0),rem=p.a-sum,c=esc(p.c);
  document.title='مصرف از دریافتی '+p.s;
  document.body.innerHTML=`<div class="card"><div style="display:flex;align-items:center;gap:10px"><img src="${LOGO}" alt="HAIC" style="height:48px;width:auto"><b>شرکت صنعتی هرات ارمغان</b></div></div>
  <div class="card"><h1>دریافتی از «${esc(p.s)}»</h1>
    <div><span class="total in">+${fa(p.a)}</span><span class="unit">${c}</span></div>
    <div class="sum"><span>تاریخ: ${fd(p.d)}</span></div>${Number(p.r)>0?`<div class="sum"><span>نرخ روز: ${fa(p.r)} ${esc(p.b||'')} ← معادل ${fa(p.a*p.r)} ${esc(p.b||'')}</span></div>`:''}${p.n?`<div class="sum"><span>${esc(p.n)}</span></div>`:''}
    <div class="sum" style="margin-top:10px"><span class="out">مصرف شده: <b>${fa(sum)} ${c}</b></span><span class="${rem<0?'out':'in'}">باقی‌مانده: <b>${fa(rem)} ${c}</b></span></div></div>
  <div class="card"><h1>مصارف از این دریافتی</h1>${o.length?o.map(t=>`<div class="tx"><div>${esc(t.t||t.k)}<small>${esc(t.k)} · ${fd(t.d)}</small></div><b class="out">−${fa(t.a)} ${c}</b></div>`).join(''):'<div class="empty">هنوز از این دریافتی مصرفی ثبت نشده</div>'}</div>
  <div class="empty">این گزارش در ${fd(p.g||today())} ساخته شده است</div>`;
}
window.onhashchange=()=>{if(location.hash.indexOf('#v=')===0)location.reload()};
let lastSel=null;
function pick(){return new Promise(res=>{
  const inc=S.tx.filter(t=>t.type==='in').sort((a,b)=>b.iso.localeCompare(a.iso)||b.id-a.id);
  if(!inc.length){alert('هنوز دریافتی ثبت نشده');res(null);return}
  const pk=$('#pk');
  pk.innerHTML=`<div class="sh"><b>کدام دریافتی در گزارش چاپ شود؟</b>
  <div class="top"><button class="lk" data-a="all">انتخاب همه</button><button class="lk" data-a="none">هیچ‌کدام</button></div>
  <div class="ls">${inc.map(t=>`<label class="pr"><input type="checkbox" class="ck" value="${t.id}" checked><span class="m">${esc(t.source)}<small>${esc(t.note?t.note+' · ':'')}${fd(t.iso)}</small></span><b class="in">+${fa(t.amount)} ${esc(t.cur)}</b></label>`).join('')}</div>
  <label class="pr"><input type="checkbox" id="pkO" checked><span class="m">مصارف همین منبع‌ها هم در گزارش باشد</span></label>
  <div class="row"><button class="go" data-a="cancel" style="background:var(--bg);color:var(--tx);border:1px solid var(--bd)">لغو</button><button class="go" id="pkOk" data-a="ok"></button></div></div>`;
  const cks=()=>[...pk.querySelectorAll('.ck')];
  const upd=()=>{$('#pkOk').textContent='ادامه ('+fa(cks().filter(c=>c.checked).length)+')'};
  upd();pk.classList.add('on');
  const done=v=>{pk.classList.remove('on');pk.innerHTML='';pk.onclick=pk.onchange=null;res(v)};
  pk.onchange=upd;
  pk.onclick=e=>{
    if(e.target===pk)return done(null);
    const a=e.target.dataset&&e.target.dataset.a;
    if(a==='all'||a==='none'){cks().forEach(c=>c.checked=a==='all');upd()}
    else if(a==='cancel')done(null);
    else if(a==='ok'){
      const ids=new Set(cks().filter(c=>c.checked).map(c=>c.value));
      if(!ids.size){alert('حداقل یک دریافتی را انتخاب کن');return}
      done({ids,withOut:$('#pkO').checked});
    }
  };
})}
function reportHTML(sel){
  const keys=new Set(S.tx.filter(t=>t.type==='in'&&sel.ids.has(String(t.id))).map(t=>t.source+'|||'+t.cur));
  const X=S.tx.filter(t=>t.type==='in'?sel.ids.has(String(t.id)):(sel.withOut&&keys.has(t.source+'|||'+t.cur)));
  const B={},T={};
  X.forEach(t=>{T[t.cur]=T[t.cur]||{i:0,o:0};T[t.cur][t.type==='in'?'i':'o']+=t.amount;const k=t.source+'|||'+t.cur;B[k]=B[k]||{s:t.source,c:t.cur,v:0};B[k].v+=t.type==='in'?t.amount:-t.amount});
  const th=a=>'<tr>'+a.map(x=>`<th style="background:#e8f1f0;padding:7px;text-align:right;font-size:13px;border-bottom:2px solid #0f766e">${x}</th>`).join('')+'</tr>';
  const td=a=>'<tr>'+a.map(x=>`<td style="padding:7px;font-size:13px;border-bottom:1px solid #ddd;text-align:right">${x}</td>`).join('')+'</tr>';
  const tb=(head,rows)=>`<table style="width:100%;border-collapse:collapse;margin:6px 0 18px">${th(head)}${rows.join('')}</table>`;
  const L=X.slice().sort((a,b)=>a.iso.localeCompare(b.iso)||a.id-b.id);
  const Li=L.filter(t=>t.type==='in'),Lo=L.filter(t=>t.type==='out'),hasR=Li.some(t=>t.rate);
  const sumBy=arr=>{const m={};arr.forEach(t=>m[t.cur]=(m[t.cur]||0)+t.amount);return m};
  const foot=(label,n,m,bg)=>Object.keys(m).map(c=>`<tr><td colspan="${n}" style="padding:8px;font-size:14px;font-weight:700;background:${bg};text-align:right;border-top:2px solid #333">${label} (${esc(c)})</td><td style="padding:8px;font-size:14px;font-weight:700;background:${bg};text-align:right;border-top:2px solid #333">${fa(m[c])} ${esc(c)}</td></tr>`).join('');
  const tb2=(head,rows,ft)=>`<table style="width:100%;border-collapse:collapse;margin:6px 0 18px">${th(head)}${rows.join('')||td(['—'].concat(head.slice(1).map(()=>'')))}${ft}</table>`;
  return `<div style="display:flex;align-items:center;gap:12px;border-bottom:3px solid #0f766e;padding-bottom:12px"><img src="${LOGO}" style="height:72px;width:auto"><div><div style="font-size:20px;font-weight:700">شرکت صنعتی هرات ارمغان</div><div dir="ltr" style="text-align:right;font-size:13px;color:#555">Herat Armaghan Industrial Company</div></div></div>
  <div style="font-size:12px;color:#555;margin:8px 0 14px">هرات، سرک فرقه بین شهید علاالدین ۱۶ و ۱۸ · <span dir="ltr">+93 794 531 006</span> · <span dir="ltr">+93 700 022 460</span> · <span dir="ltr">info@haic.ltd</span> · <span dir="ltr">haic.ltd</span></div>
  <div style="font-size:18px;font-weight:700">گزارش دخل و خرج</div><div style="font-size:13px;color:#555;margin-bottom:12px">تاریخ گزارش: ${fd(today())}</div>
  <div style="font-weight:700;margin-top:8px">لیست دریافتی‌ها</div>
  ${tb2(hasR?['تاریخ','منبع','توضیح','نرخ روز','مبلغ']:['تاریخ','منبع','توضیح','مبلغ'],Li.map(t=>td([fd(t.iso),esc(t.source),esc(t.note||'—')].concat(hasR?[t.rate?fa(t.rate)+' '+esc(S.base):'—']:[]).concat(['+'+fa(t.amount)+' '+esc(t.cur)+(t.rate?'<br><small>≈ '+fa(t.amount*t.rate)+' '+esc(S.base)+'</small>':'')]))),foot('جمع کل دریافتی',hasR?4:3,sumBy(Li),'#e6f4ea'))}
  ${sel.withOut?`<div style="font-weight:700">لیست مصارف</div>
  ${tb2(['تاریخ','تفصیل','دسته','منبع','مبلغ'],Lo.map(t=>td([fd(t.iso),esc(t.note||'—'),esc(t.cat),esc(t.source),'−'+fa(t.amount)+' '+esc(t.cur)])),foot('جمع کل مصرف',4,sumBy(Lo),'#fde8e8'))}`:''}
  <div style="font-weight:700">باقی‌مانده کل</div>
  ${tb(['نوعیت','دریافتی','مصرف','باقی‌مانده'],Object.keys(T).map(c=>td([esc(c),fa(T[c].i),fa(T[c].o),'<b>'+fa(T[c].i-T[c].o)+'</b>'])))}
  <div style="font-weight:700">موجودی هر منبع</div>
  ${tb(['منبع','نوعیت','باقی‌مانده'],Object.values(B).map(b=>td([esc(b.s),esc(b.c),fa(b.v)])))}
  <div style="text-align:center;font-size:12px;color:#555;border-top:1px solid #ddd;padding-top:8px"><span dir="ltr">www.haic.ltd · info@haic.ltd</span></div>`;
}
$('#bk').onclick=async()=>{
  try{await saveFile('HAIC-backup-'+today()+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}));toast('پشتیبان ذخیره شد ✓')}
  catch(e){if(!(e&&e.code==='declined'))alert('ذخیرهٔ پشتیبان در این صفحه ممکن نشد')}
};
$('#rs').onclick=()=>$('#rf').click();
$('#rf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.tx))throw 0;
    const ids=new Set(S.tx.map(t=>t.id));let n=0;
    d.tx.forEach(t=>{if(t&&t.amount>0&&t.source&&!ids.has(t.id)){S.tx.push(Object.assign({cur:d.unit||'تومان',iso:today()},t));n++}});
    (d.cur||[]).forEach(c=>{if(!S.cur.includes(c))S.cur.push(c)});
    S.tx.forEach(t=>{if(!S.cur.includes(t.cur))S.cur.push(t.cur)});
    save();render();toast(fa(n)+' مورد بازیابی شد ✓')}
  catch(_){alert('این فایل پشتیبان درست نیست')}
};
$('#pvb').onclick=async()=>{
  if(!S.tx.length){alert('هنوز چیزی ثبت نشده');return}
  const sel=await pick();if(!sel)return;lastSel=sel;
  const pp=$('#paper');pp.innerHTML=reportHTML(sel);
  pp.style.zoom=Math.min(1,(window.innerWidth-24)/794);
  $('#pv').classList.add('on');$('#pvs').scrollTop=0;
};
$('#pvc').onclick=()=>$('#pv').classList.remove('on');
$('#pvp').onclick=()=>{toast('در حال ساختن PDF…');makePdf(lastSel)};
async function makePdf(sel){
  const b=$('#prn'),lbl=b.textContent;
  b.disabled=true;b.textContent='در حال ساختن PDF…';
  const box=document.createElement('div');
  box.dir='rtl';box.style.cssText='position:fixed;left:-10000px;top:0;width:794px;padding:36px;background:#fff;color:#000;font-family:-apple-system,Tahoma,sans-serif';
  box.innerHTML=reportHTML(sel);document.body.appendChild(box);
  try{
    if(!window.html2canvas||!window.jspdf)throw {code:'unavailable'};
    const cv=await html2canvas(box,{scale:2,backgroundColor:'#fff'});
    const pdf=new window.jspdf.jsPDF('p','pt','a4');
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),sh=Math.floor(ph*cv.width/pw);
    for(let y=0,i=0;y<cv.height;y+=sh,i++){
      const h2=Math.min(sh,cv.height-y),c=document.createElement('canvas');c.width=cv.width;c.height=h2;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,h2);x.drawImage(cv,0,y,cv.width,h2,0,0,cv.width,h2);
      if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,h2*pw/cv.width);
    }
    await saveFile('HAIC-report-'+today()+'.pdf',pdf.output('blob'));
  }catch(e){
    if(!(e&&e.code==='declined')){try{window.print()}catch(_){alert('ساختن PDF ممکن نشد')}}
  }finally{box.remove();b.disabled=false;b.textContent=lbl}
}
$('#prn').onclick=async()=>{
  if(!S.tx.length){alert('هنوز چیزی ثبت نشده');return}
  const sel=await pick();if(sel)makePdf(sel);
};
if(VIEW)showView();else render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
